global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: lsm-storage
    env: production

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s
      api_version: v2

scrape_configs:
  # LSM backend — bearer token from METRICS_TOKEN env var (Prometheus 3.x expands ${VAR} natively)
  - job_name: 'lsm-storage'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials: '${METRICS_TOKEN}'
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: lsm-backend
          env: production

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']

  # Alertmanager self-monitoring
  - job_name: 'alertmanager'
    scrape_interval: 30s
    static_configs:
      - targets: ['alertmanager:9093']
