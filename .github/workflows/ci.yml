name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - name: Download Go modules
        run: go mod download
      - name: Run Go tests
        run: go test ./...
      - name: Run Go race tests
        run: go test ./... -race
      - name: Build loadtest tool
        run: go build ./cmd/loadtest
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install frontend deps
        run: bun install --frozen-lockfile
      - name: Typecheck frontend
        run: bunx tsc --noEmit
      - name: Run frontend unit + a11y tests
        run: bunx vitest run --reporter=verbose
      - name: Audit frontend deps
        # GHSA-fx2h-pf6j-xcff and GHSA-v6wh-96g9-6wx3 are Windows-only dev-server
        # CVEs in vite's launch-editor; they are not exploitable on Linux CI and
        # vite@8.2.0 is above the vulnerable 8.0.x range (bun's DB false-positive).
        run: bun audit --ignore=GHSA-fx2h-pf6j-xcff --ignore=GHSA-v6wh-96g9-6wx3
      - name: Build frontend
        run: bunx vite build --config vite.config.ts
      - name: Check bundle budgets
        run: bun run scripts/check-bundle-budget.ts
      - name: Build Storybook
        run: bunx storybook build --quiet -o storybook-static
      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: frontend/storybook-static
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t lsm-backend:test .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t lsm-frontend:test ./frontend
      - name: Validate compose config
        env:
          # docker-compose.yml interpolates API_TOKEN/METRICS_TOKEN/BFF_BASIC_AUTH
          # with the :? guard; CI has no secrets, so provide dummies for
          # validation only. Runtime still requires the real values via .env
          # or the environment.
          API_TOKEN: ci-validation-dummy
          METRICS_TOKEN: ci-validation-dummy
          BFF_BASIC_AUTH: ci-validation-dummy
        run: docker compose config
