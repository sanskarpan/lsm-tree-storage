{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lsm-storage.fullname" . }}-auth
  labels:
    {{- include "lsm-storage.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    # IMPORTANT: Replace the placeholder values below with real secrets before use.
    # You can also delete this Secret and set auth.existingSecret to an externally
    # managed Secret name instead:
    #
    #   kubectl create secret generic my-lsm-secrets \
    #     --from-literal=API_TOKEN=<your-token> \
    #     --from-literal=METRICS_TOKEN=<your-metrics-token> \
    #     --from-literal=BFF_BASIC_AUTH=user:password
    #
    #   helm upgrade lsm-storage ./helm/lsm-storage \
    #     --set auth.existingSecret=my-lsm-secrets
type: Opaque
data:
  # Base64-encoded placeholder values — REPLACE THESE before deploying to production!
  # echo -n 'changeme' | base64
  API_TOKEN: {{ "changeme" | b64enc | quote }}
  METRICS_TOKEN: {{ "changeme-metrics" | b64enc | quote }}
  # Format: user:password  (e.g. admin:supersecret)
  BFF_BASIC_AUTH: {{ "admin:changeme" | b64enc | quote }}
{{- end }}
