{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lsm-storage.fullname" . }}
  labels:
    {{- include "lsm-storage.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                {{- if eq .service "backend" }}
                name: {{ include "lsm-storage.backendServiceName" $ }}
                port:
                  number: {{ $.Values.service.backend.port }}
                {{- else }}
                name: {{ include "lsm-storage.frontendServiceName" $ }}
                port:
                  number: {{ $.Values.service.frontend.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
