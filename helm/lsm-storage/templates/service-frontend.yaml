apiVersion: v1
kind: Service
metadata:
  name: {{ include "lsm-storage.frontendServiceName" . }}
  labels:
    {{- include "lsm-storage.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.frontend.type }}
  selector:
    {{- include "lsm-storage.frontendSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.frontend.port }}
      targetPort: http
      protocol: TCP
